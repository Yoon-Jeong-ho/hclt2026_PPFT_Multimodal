[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "hclt2026-ppft-multimodal"
version = "0.1.0"
description = "Paper code for multimodal representation alignment and privacy-preserving domain adaptation"
requires-python = ">=3.11"
dependencies = [
  "accelerate==1.14.0",
  "huggingface-hub==1.28.0",
  "numpy==2.4.6",
  "peft==0.20.0",
  "pillow==12.1.1",
  "pyyaml==6.0.3",
  "safetensors==0.8.0",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "tokenizers==0.22.2",
  "transformers==5.15.1",
]

[project.optional-dependencies]
train = ["deepspeed==0.19.1", "kernels==0.16.1", "tilelang==0.1.14", "triton==3.6.0"]
dev = ["pytest==8.4.2", "ruff==0.15.7", "mypy==1.19.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: requires model weights and CUDA"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
